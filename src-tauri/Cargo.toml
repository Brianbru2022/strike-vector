[package]
name = "iron-kestrel-87"
version = "1.2.0-dev.1"
description = "Iron Kestrel '87 Windows edition"
authors = ["Iron Kestrel development team"]
edition = "2021"

[lib]
name = "iron_kestrel_87_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
